[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qradiomics"
version = "0.9.5"
description = "Radiomics research CLI — extract, merge, analyze in one Unix-style pipeline."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Wookjin Choi, Pradeep Bhetwal", email = "wookjin.choi@jefferson.edu"}
]
keywords = ["radiomics", "pyradiomics", "cli", "tcia", "lung-cancer", "medical-imaging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.0.0",
    "httpx>=0.24.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    # pyradiomics is NOT here: it is an extra. See [project.optional-dependencies].
    "pydicom>=2.4",
    "SimpleITK>=2.2.0",
    "numpy>=1.24.0",
    # statsmodels<=0.14.6 calls pandas' deprecate_kwarg() with its pre-3.0
    # positional signature (old_arg_name, new_arg_name); pandas 3.0 requires
    # a leading `klass` arg, so importing statsmodels.tsa (pulled in by
    # statsmodels.api, used by `qr analyze classify`/`survival`) crashes with
    # "missing 1 required positional argument" on any pandas>=3.0. Cap until
    # statsmodels ships a pandas-3-compatible release.
    "pandas>=1.5.0,<3.0",
    "scikit-learn>=1.2.0",
    "scikit-image>=0.21.0",
    "lifelines>=0.27.0",
    "statsmodels>=0.14.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
# The default feature-extraction engine, optional for the same reason pysera is:
# it is one engine among several, and nothing else in the package needs it. The
# three import sites are all inside functions, so `qr` runs without it and only
# extraction requires it.
#
# It has to be an extra rather than a hard dependency because it cannot be
# installed from PyPI at all on Python 3.10+: the wheels stop at cp39 and the
# 3.1.0 sdist declares version 3.0.1a1 in its metadata, so pip discards it and
# reports "No matching distribution found". Requiring it therefore made plain
# `pip install qradiomics` fail for every modern interpreter, including Colab.
#
# Install it from upstream git, which is what scripts/kickoff.sh does on 3.10+
# and what dev installs already use:
#
#     pip install "pyradiomics @ git+https://github.com/AIM-Harvard/pyradiomics.git"
#
# Do NOT loosen the bound to ">=3.0.1" to dodge this: pip would then try to
# *build* the broken 3.1.0 sdist instead of discarding it, and the install fails.
pyradiomics = ["pyradiomics>=3.1.0"]
shap = ["shap>=0.41.0"]
rtstruct = ["rt-utils>=1.2.7"]
prefect = ["prefect>=2.10"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
pysera = [
    "pysera",
]
pysera-deep = [
    "pysera",
    "torch",
    "torchvision",
]

[project.urls]
Homepage = "https://qradiomics.com/"
Repository = "https://github.com/choilab-jefferson/qradiomics"
Documentation = "https://qradiomics.com/"
"Bug Tracker" = "https://github.com/choilab-jefferson/qradiomics/issues"

[project.scripts]
qradiomics = "qradiomics.cli.main:cli"
qr = "qradiomics.cli.main:cli"
qrdx = "qradiomics.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["qradiomics*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"qradiomics" = ["data/templates/*.yaml", "data/pyradiomics/*.yaml", "data/schema/*.yaml"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py311"
